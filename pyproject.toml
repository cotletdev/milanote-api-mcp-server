[project]
name = "milanote-api-mcp"
version = "1.0.1"
description = "Self-hosted Milanote API and MCP server on your own Chrome session. Noncommercial use (PolyForm Noncommercial 1.0.0)."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["milanote", "milanote api", "milanote mcp", "mcp server", "claude", "chatgpt", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
    "websockets>=13",
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/milanote-api-mcp-server"
Source = "https://github.com/cotletdev/milanote-api-mcp-server"

[project.scripts]
milanote-mcp = "milanote_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["milanote_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
